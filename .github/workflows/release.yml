name: EmbyTok Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: false
        type: string

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check (optional)
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Build web
        run: npm run build

      - name: Create dist.zip
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Extract version
        id: extract-version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: generate-notes
        run: |
          cat > release-notes.txt << 'EOF'
          # EmbyTok v${{ steps.extract-version.outputs.VERSION }}

          ## 🚀 新功能

          ### Emby API 深度集成
          - Emby Recommendations API - 智能推荐系统
          - UserData 深度集成 - 播放进度自动同步、用户评分
          - 智能播放队列 - 支持剧集自动连播
          - BoxSet 支持增强 - 优化的合集展示

          ### TikTok 风格体验
          - 短视频预览 - 滚动停留自动播放
          - 虚拟滚动 - 大规模列表流畅浏览
          - 智能预加载 - 基于滑动方向预测
          - 无缝连播 - 无感知视频切换
          - 图像API优化 - 响应式加载，WebP支持

          ### 性能优化
          - 本地缓存系统 - IndexedDB + LRU
          - Service Worker增强 - 离线支持
          - 批量API调用优化 - 减少网络请求

          ### 用户体验
          - 骨架屏加载 - 友好的加载状态
          - 多用户快速切换
          - 错误恢复机制 - 指数退避重试

          ## 📦 安装

          ### Web
          下载 [dist.zip](dist.zip) 并部署到Web服务器

          ### Docker (可选)
          ```bash
          docker pull 1525745393/embytok:${{ steps.extract-version.outputs.VERSION }}
          docker run -p 8080:80 1525745393/embytok:${{ steps.extract-version.outputs.VERSION }}
          ```

          ### Android
          APK 文件包含在本次发布中

          ## 📝 更新说明
          完整的变更记录请查看 [CHANGELOG.md](CHANGELOG.md)
          EOF

      - name: Create GitHub Release (最优先！)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist.zip
          tag_name: ${{ steps.extract-version.outputs.TAG_NAME }}
          name: Release v${{ steps.extract-version.outputs.VERSION }}
          body_path: release-notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (可选)
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Login to Docker Hub (可选)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Build and push Docker image (可选，允许失败)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            1525745393/embytok:${{ steps.extract-version.outputs.VERSION }}
            1525745393/embytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

