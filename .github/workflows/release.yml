name: Build and Release

on:
  release:
    types: [published]
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true
      prerelease:
        description: "是否作为预发布（pre-release）"
        required: false
        default: "false"

jobs:
  init-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          items=()

          items+=('{"build": "docker", "os": "ubuntu-latest"}')
          items+=('{"build": "android", "os": "ubuntu-latest"}')

          matrix="matrix=["
          for ((i=0; i<${#items[@]}; i++)); do
            matrix+=" ${items[i]}"
            if ((i != ${#items[@]}-1)); then
              matrix+=","
            fi
          done
          matrix+="]"

          echo $matrix >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit and integration tests
        run: npm run test:run

      - name: Check Prettier formatting
        run: npx prettier --check .

  build-app:
    needs: [init-matrix, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.init-matrix.outputs.matrix)}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        if: ${{ matrix.build == 'docker' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ matrix.build == 'docker' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        if: ${{ matrix.build == 'docker' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:${{ github.event.inputs.tag || github.ref_name }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web
        if: ${{ matrix.build == 'android' }}
        run: npm run build

      - name: Sync Capacitor
        if: ${{ matrix.build == 'android' }}
        run: npx cap sync android

      - name: Set up JDK 17
        if: ${{ matrix.build == 'android' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare Android signing
        if: ${{ matrix.build == 'android' }}
        id: prepare-signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/embytok-release.keystore
            echo "ANDROID_KEYSTORE=1" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PATH=embytok-release.keystore" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "signing_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "signing_enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Gradle Build Action
        if: ${{ matrix.build == 'android' }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.1"
          cache-read-only: false

      - name: Build Debug APK
        if: ${{ matrix.build == 'android' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ matrix.build == 'android' }}
        run: |
          cd android
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Rename APKs
        if: ${{ matrix.build == 'android' }}
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mv android/app/build/outputs/apk/debug/app-debug.apk EmbyTok-$version-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            mv android/app/build/outputs/apk/release/app-release.apk EmbyTok-$version-release.apk
          fi

      - name: Check if release APK exists
        if: ${{ matrix.build == 'android' }}
        id: check-release
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -f "EmbyTok-$version-release.apk" ]; then
            echo "has_release_apk=true" >> $GITHUB_OUTPUT
          else
            echo "has_release_apk=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debug APK artifact
        if: ${{ matrix.build == 'android' }}
        uses: actions/upload-artifact@v4
        with:
          name: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-debug
          path: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-debug.apk

      - name: Upload Release APK artifact
        if: ${{ matrix.build == 'android' && steps.check-release.outputs.has_release_apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-release
          path: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-release.apk

      - name: Get changelog
        id: get-changelog
        shell: bash
        run: |
          if [ ! -s CHANGELOG.md ]; then
            echo "CHANGELOG.md 不存在或为空，无法生成 Release 说明。"
            exit 1
          fi

          delimiter="__EMBYTOK_CHANGELOG_EOF__"
          {
            echo "CHANGELOG<<$delimiter"
            node scripts/extract-changelog.js ${{ github.event.inputs.tag || github.ref_name }}
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release type
        id: release-type
        shell: bash
        run: |
          prerelease=false
          if [ "${{ github.event_name }}" = "release" ]; then
            prerelease="${{ github.event.release.prerelease }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT

      - name: Create Release - Android
        uses: svenstaro/upload-release-action@v2
        if: ${{ matrix.build == 'android' }}
        with:
          overwrite: true
          asset_name: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-debug.apk
          file: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-debug.apk
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          body: ${{ steps.get-changelog.outputs.CHANGELOG }}
          tag: ${{ github.event.inputs.tag || github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release - Android Release
        uses: svenstaro/upload-release-action@v2
        if: ${{ matrix.build == 'android' && steps.check-release.outputs.has_release_apk == 'true' }}
        with:
          overwrite: true
          asset_name: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-release.apk
          file: EmbyTok-${{ github.event.inputs.tag || github.ref_name }}-release.apk
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          body: ${{ steps.get-changelog.outputs.CHANGELOG }}
          tag: ${{ github.event.inputs.tag || github.ref }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
