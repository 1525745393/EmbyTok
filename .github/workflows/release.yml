name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3, leave empty to use package.json)'
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      push_docker:
        description: 'Push Docker image'
        required: true
        type: boolean
        default: true
      build_android:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit and integration tests
        run: npm run test:run

      - name: Check Prettier formatting
        run: npx prettier --check .

  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

  check-tag:
    name: Check Tag
    runs-on: ubuntu-latest
    needs: extract-version
    outputs:
      tag_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if tag exists
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ needs.extract-version.outputs.version }}";
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              return { exists: 'true' };
            } catch (error) {
              if (error.status === 404) {
                return { exists: 'false' };
              }
              throw error;
            }

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [extract-version, check-tag]
    if: ${{ inputs.push_docker != false && needs.check-tag.outputs.tag_exists == 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:${{ needs.extract-version.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [extract-version, check-tag]
    if: ${{ inputs.build_android != false && needs.check-tag.outputs.tag_exists == 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Build Action
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-read-only: false

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION=${{ needs.extract-version.outputs.version }}
          mv android/app/build/outputs/apk/debug/app-debug.apk EmbyTok-v${VERSION}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyTok-v${{ needs.extract-version.outputs.version }}-debug
          path: EmbyTok-v${{ needs.extract-version.outputs.version }}-debug.apk

  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [extract-version, check-tag]
    if: ${{ inputs.create_release != false && needs.check-tag.outputs.tag_exists == 'false' }}
    outputs:
      release_body: ${{ steps.generate.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract changelog
        id: generate
        run: |
          VERSION=${{ needs.extract-version.outputs.version }}
          BODY=$(node scripts/extract-changelog.js $VERSION)
          # 使用EOF来安全处理多行内容
          echo 'body<<EOF' >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-version, check-tag, docker, android, generate-release-notes]
    if: ${{ inputs.create_release != false && needs.check-tag.outputs.tag_exists == 'false' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: EmbyTok-v${{ needs.extract-version.outputs.version }}-debug

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: EmbyTok-v${{ needs.extract-version.outputs.version }}-debug.apk
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: Release v${{ needs.extract-version.outputs.version }}
          body: ${{ needs.generate-release-notes.outputs.release_body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
