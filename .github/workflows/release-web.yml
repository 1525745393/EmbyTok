name: Build and Release Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: false
        type: string

jobs:
  build-and-release:
    name: Build and Release Web
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Create dist.zip
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Extract version
        id: extract-version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist.zip
          tag_name: ${{ steps.extract-version.outputs.TAG_NAME }}
          name: Release v${{ steps.extract-version.outputs.VERSION }}
          body: |
            # EmbyTok v${{ steps.extract-version.outputs.VERSION }}

            ## 📦 下载
            下载下方 dist.zip 部署到 Web 服务器即可使用！

            ## 🎉 新功能
            - Emby API 深度集成
            - TikTok 风格体验
            - 性能优化
            - 用户体验提升

            完整变更请查看 CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

