name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: 构建 Web 和 dist.zip（必须成功！）
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Create dist.zip
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Extract version
        id: extract-version
        run: |
          VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check-tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.extract-version.outputs.VERSION }}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              return { exists: true, tag: tag };
            } catch (error) {
              if (error.status === 404) {
                return { exists: false, tag: tag };
              }
              throw error;
            }

      - name: Create GitHub Release
        if: github.event_name == 'push' && !fromJSON(steps.check-tag.outputs.result).exists
        uses: softprops/action-gh-release@v1
        with:
          files: dist.zip
          tag_name: v${{ steps.extract-version.outputs.VERSION }}
          name: Release v${{ steps.extract-version.outputs.VERSION }}
          body: |
            # EmbyTok v${{ steps.extract-version.outputs.VERSION }}

            ## 📦 下载
            下载下方 dist.zip 部署到 Web 服务器即可使用！

            ## 🎉 更新内容
            - Emby API 深度集成
            - TikTok 风格体验
            - 性能优化
            - 用户体验提升
            - 各种 Bug 修复
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: 构建 Docker 镜像（可选，允许失败）
  docker:
    needs: build-web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Extract version from package.json
        id: extract-version
        run: |
          VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:${{ steps.extract-version.outputs.VERSION }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # Job 3: 构建 Android APK（可选，允许失败）
  android:
    needs: build-web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Build Action
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-read-only: false

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract version from package.json
        id: extract-version
        run: |
          VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: embytok-apk-${{ steps.extract-version.outputs.VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
