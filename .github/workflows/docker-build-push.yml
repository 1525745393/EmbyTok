name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract version from package.json
        id: extract-version
        run: |
          VERSION=$(node -e "import('./package.json', {assert: {type: 'json'}}).then(p => console.log(p.default.version))")
          # 备选方案：使用 grep 提取
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -o '"version":\s*"[^"]*"' package.json | cut -d'"' -f4)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:${{ steps.extract-version.outputs.VERSION }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max