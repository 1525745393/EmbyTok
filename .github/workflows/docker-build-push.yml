name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: 构建 Docker 镜像
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract version from package.json
        id: extract-version
        run: |
          VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:${{ steps.extract-version.outputs.VERSION }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/embytok:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: 构建 Android APK
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Build Action
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-read-only: false

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract version from package.json
        id: extract-version
        run: |
          VERSION=$(grep -E '"version":' package.json | head -1 | awk -F': ' '{print $2}' | sed 's/[", ]//g')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: embytok-apk-${{ steps.extract-version.outputs.VERSION }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check if tag exists
        id: check-tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.extract-version.outputs.VERSION }}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              return { exists: true, tag: tag };
            } catch (error) {
              if (error.status === 404) {
                return { exists: false, tag: tag };
              }
              throw error;
            }

      - name: Create Release (only on push to main and tag doesn't exist)
        if: github.event_name == 'push' && !fromJSON(steps.check-tag.outputs.result).exists
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ steps.extract-version.outputs.VERSION }}
          name: Release v${{ steps.extract-version.outputs.VERSION }}
          body: |
            # EmbyTok v${{ steps.extract-version.outputs.VERSION }} 更新说明

            ## 下载安装
            - 下载下方 APK 文件安装到 Android 设备

            ## 本次更新
            ### v${{ steps.extract-version.outputs.VERSION }}
            - 完善进度条拖动快进功能

            ## 历史更新
            ### v1.6.2
            - 进度条显示/隐藏优化

            ### v1.6.1
            - 修复 Android 登录问题（支持 HTTP 和自签名证书）

            ### v1.6.0
            - 记忆播放进度
            - 播放失败自动重试
            - 更好的错误提示
            - 播放速度调节功能

            ## 功能特点
            - TikTok 式竖屏浏览体验
            - 支持 Emby/Jellyfin 服务器
            - 双击屏幕显示/隐藏进度条
            - 长按快进手势
            - 记忆播放进度
            - 速度调节 0.5x-5.0x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
