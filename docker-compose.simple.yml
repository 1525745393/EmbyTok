version: '3.8'

services:
  # EmbyTok 前端应用 - 简单版配置
  embytok:
    image: embytok:latest
    container_name: embytok-web
    restart: unless-stopped
    ports:
      - "8080:80"  # Web界面端口
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# 如果需要连接到现有的Emby服务器，请确保:
# 1. 服务器网络可访问
# 2. 在应用中正确配置Emby服务器URL
# 3. 防火墙允许相应端口(默认8096)的访问