version: '3.8'

services:
  # EmbyTok 前端应用 - 群晖专用配置
  embytok:
    image: 1525745393/embytok:latest
    container_name: embytok-web
    restart: unless-stopped
    ports:
      - "8080:80"  # Web界面端口
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai  # 设置时区为中国上海
    networks:
      - embytok-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  embytok-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
